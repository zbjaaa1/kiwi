name: Build img
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build configurations
        uses: actions/checkout@v4
     
      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p ~/.local/bin
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          pmbootstrap --version

      - name: pmbootstrap init
        run: |
          sudo chmod 777 pmbootstrap_v3.cfg
          git clone https://gitlab.postmarketos.org/postmarketOS/pmaports.git -b v24.12 pmaports
          pmbootstrap --config pmbootstrap_v3.cfg --aports pmaports --assume-yes init
          
      - name: pmbootstrap install
        run: |
          pmbootstrap install --password 147147 --recovery-install-partition=data
          pmbootstrap export
          
      - name: log
        if: ${{ failure() }}
        run: |
          cat ~/.local/var/pmbootstrap/log.txt
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiwi
          path: /tmp/postmarketOS-export/*.img
          retention-days: 1
