name: Build zip
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build configurations
        uses: actions/checkout@v4
     
      - name: Install pmbootstrap from git
        run: |
          git clone --depth=1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git
          mkdir -p ~/.local/bin
          ln -s "$PWD/pmbootstrap/pmbootstrap.py" ~/.local/bin/pmbootstrap
          pmbootstrap --version

      - name: pmbootstrap init
        run: |
          sudo mv pmbootstrap_v3.cfg -v /home/runner/.config/pmbootstrap_v3.cfg
          sudo chmod 777 -v /home/runner/.config/pmbootstrap_v3.cfg
          yes '' | pmbootstrap --details-to-stdout init
          
      - name: pmbootstrap install
        run: |
          sudo mv pmaports.cfg -v /home/runner/.local/var/pmbootstrap/cache_git/pmaports/pmaports.cfg
          sudo chmod 777 -v /home/runner/.local/var/pmbootstrap/cache_git/pmaports/pmaports.cfg
          pmbootstrap install --password 147147 --android-recovery-zip  --recovery-install-partition=data
          pmbootstrap export
          
      - name: log
        if: ${{ failure() }}
        run: |
          cat /home/runner/.local/var/pmbootstrap/log.txt
          
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kiwi
          path: /tmp/postmarketOS-export/*.zip
          retention-days: 1
